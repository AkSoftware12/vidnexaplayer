org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=true

# Kotlin's incremental compiler cannot relativize paths across drive letters on
# Windows (project on D:, Gradle/pub cache on C:) and fails every build with
# "this and base files have different roots". Incremental compilation off
# trades a bit of build speed for builds that actually complete.
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
systemProp.java.net.preferIPv4Stack=true
